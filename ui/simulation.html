<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chaos Command Center - Simulation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js for analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['"Share Tech Mono"', 'monospace'],
          },
          colors: {
            'netflix-red': '#E50914',
            'netflix-black': '#141414',
            'netflix-gray': '#b3b3b3',
            'netflix-dark-gray': '#222',
            'netflix-light-gray': '#f5f5f1',
          },
          keyframes: {
            pulseStatus: {
              '0%, 100%': { opacity: 1 },
              '50%': { opacity: 0.3 },
            }
          },
          animation: {
            'pulse-status': 'pulseStatus 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        },
      },
    };
  </script>
  <style>
    /* Custom scrollbar */
    .log-panel::-webkit-scrollbar,
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .log-panel::-webkit-scrollbar-track,
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #333;
      border-radius: 10px;
    }
    .log-panel::-webkit-scrollbar-thumb,
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #666;
      border-radius: 10px;
    }
    .log-panel::-webkit-scrollbar-thumb:hover,
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #888;
    }

    /* Animation for the toast notification */
    @keyframes fadeInOut {
      0%, 100% { opacity: 0; transform: translateY(-20px); }
      10%, 90% { opacity: 1; transform: translateY(0); }
    }
    .toast-notification {
      animation: fadeInOut 3s ease-in-out forwards;
    }

    /* Custom styles for selects */
    .custom-select {
      background-color: #333;
      border-color: #555;
      color: #f5f5f1;
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%23b3b3b3' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
      background-position: right 0.5rem center;
      background-repeat: no-repeat;
      background-size: 1.5em 1.5em;
      padding-right: 2.5rem;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
    }
  </style>
</head>
<body class="bg-netflix-black text-netflix-light-gray font-sans h-full">
  
  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed top-24 right-5 z-50">
    <!-- Toast notifications will be injected here -->
  </div>

  <!-- Header -->
  <header class="bg-netflix-black sticky top-0 z-40 w-full border-b border-zinc-800">
    <div class="container mx-auto px-4 md:px-8 py-4 flex justify-between items-center">
      <div class="flex items-center gap-4">
        <!-- Netflix "N" Icon SVG -->
        <svg viewBox="0 0 100 150" fill="#E50914" height="40" class="w-auto">
          <path d="M 0 150 L 0 0 L 33 0 L 33 75 C 33 75 40 50 65 50 C 90 50 100 75 100 75 L 100 150 L 66 150 L 66 75 C 66 75 60 50 40 50 C 20 50 0 75 0 75 L 0 150 Z"></path>
        </svg>
        <h1 class="text-xl md:text-3xl font-bold text-white">Chaos Command Center</h1>
      </div>
      <nav class="flex items-center gap-4">
        <a href="index.html" class="text-sm md:text-base font-semibold text-netflix-gray hover:text-white transition-colors">Dashboard</a>
        <a href="simulation.html" class="text-sm md:text-base font-semibold text-white border-b-2 border-netflix-red pb-1">Simulation</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <div class="container mx-auto p-4 md:p-8 flex flex-col">
    <!-- Top Grid: Controls and Logs -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- Left Column: Controls & Status -->
      <div class="md:col-span-1 flex flex-col gap-6">
        
        <!-- EXTENDED Control Panel -->
        <div class="bg-netflix-dark-gray border border-zinc-700 rounded-lg shadow-lg p-6">
          <h2 class="text-lg font-semibold text-white mb-5">Simulation Controls</h2>
          
          <form id="chaos-form" class="space-y-4">
            <div>
              <label for="target-service" class="block text-sm font-medium text-netflix-gray mb-1">Target Service</label>
              <select id="target-service" class="custom-select w-full rounded-md border p-2 focus:outline-none focus:ring-2 focus:ring-netflix-red">
                <option>auth-service</option>
                <option>payment-gateway</option>
                <option>recommendations-api</option>
                <option>streaming-cdn</option>
                <option>user-db-replica</option>
              </select>
            </div>

            <div>
              <label for="experiment-type" class="block text-sm font-medium text-netflix-gray mb-1">Experiment Type</label>
              <select id="experiment-type" class="custom-select w-full rounded-md border p-2 focus:outline-none focus:ring-2 focus:ring-netflix-red">
                <option value="latency">Inject Latency</option>
                <option value="cpu">CPU Spike</option>
                <option value="terminate">Terminate Instance</option>
                <option value="packet_loss">Packet Loss</option>
              </select>
            </div>
            
            <div>
              <label for="magnitude" class="block text-sm font-medium text-netflix-gray mb-1">Magnitude (1-100)</label>
              <input type="range" id="magnitude" min="1" max="100" value="50" class="w-full h-2 bg-zinc-700 rounded-lg appearance-none cursor-pointer" />
              <div class="text-right text-sm text-white font-mono" id="magnitude-value">50</div>
            </div>

            <button type="submit" id="trigger-chaos-btn" class="w-full flex items-center justify-center gap-2 bg-netflix-red hover:bg-red-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transform transition-transform duration-150 hover:scale-105">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
              </svg>
              RUN EXPERIMENT
            </button>
          </form>
        </div>

        <!-- System Status -->
        <div class="bg-netflix-dark-gray border border-zinc-700 rounded-lg shadow-lg p-6">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold text-white">System Status</h2>
            <div class="flex items-center gap-2">
              <div id="status-dot" class="w-3 h-3 rounded-full bg-gray-500 animate-pulse"></div>
              <span id="status-text" class="text-sm font-medium text-netflix-gray">Loading...</span>
            </div>
          </div>
          <div class="space-y-3 text-sm">
            <div class="flex justify-between">
              <span class="text-netflix-gray">Last Experiment:</span>
              <span id="last-triggered" class="font-mono text-white">Never</span>
            </div>
            <div class="flex justify-between">
              <span class="text-netflix-gray">Active Services:</span>
              <span id="active-services" class="font-mono text-white">0 / 0</span>
            </div>
          </div>
        </div>

      </div>

      <!-- Right Column: Logs -->
      <div class="md:col-span-2 bg-netflix-dark-gray border border-zinc-700 rounded-lg shadow-lg p-6 flex flex-col">
        <h2 class="text-lg font-semibold text-white mb-4 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          Live Experiment Log
        </h2>
        <div id="log-panel" class="log-panel h-[500px] overflow-y-auto bg-netflix-black rounded-md p-4 font-mono text-sm text-netflix-gray space-y-2">
          <!-- Log entries will be prepended here -->
        </div>
      </div>
    </div>

    <!-- Statistics and Analytics Section -->
    <div class="mt-8">
      <h2 class="text-3xl font-bold text-white mb-6">Experiment Analytics</h2>
      
      <!-- Stats Row -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
        <div class="bg-netflix-dark-gray border border-zinc-700 rounded-lg shadow-lg p-5">
          <h3 class="text-sm font-medium text-netflix-gray mb-1">Total Experiments Run</h3>
          <span id="stat-total-runs" class="text-3xl font-bold text-white">0</span>
        </div>
        <div class="bg-netflix-dark-gray border border-zinc-700 rounded-lg shadow-lg p-5">
          <h3 class="text-sm font-medium text-netflix-gray mb-1">Avg. Recovery Time</h3>
          <span id="stat-avg-recovery" class="text-3xl font-bold text-white">0.0s</span>
        </div>
        <div class="bg-netflix-dark-gray border border-zinc-700 rounded-lg shadow-lg p-5">
          <h3 classs="text-sm font-medium text-netflix-gray mb-1">Total Services Impacted</h3>
          <span id="stat-services-impacted" class="text-3xl font-bold text-white">0</span>
        </div>
      </div>

      <!-- Impact Chart -->
      <div class="bg-netflix-dark-gray border border-zinc-700 rounded-lg shadow-lg p-6">
        <h2 class="text-2xl font-bold text-white mb-4">Service Impact Over Time</h2>
        <div class="h-80">
          <canvas id="impactChart"></canvas>
        </div>
      </div>
    </div>

  </div>

  <script>
    // --- DOM Elements ---
    const triggerBtn = document.getElementById('trigger-chaos-btn');
    const chaosForm = document.getElementById('chaos-form');
    const logPanel = document.getElementById('log-panel');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const lastTriggeredText = document.getElementById('last-triggered');
    const activeServicesText = document.getElementById('active-services');
    const toastContainer = document.getElementById('toast-container');
    const magnitudeSlider = document.getElementById('magnitude');
    const magnitudeValue = document.getElementById('magnitude-value');

    // --- Stats DOM Elements ---
    const statTotalRuns = document.getElementById('stat-total-runs');
    const statAvgRecovery = document.getElementById('stat-avg-recovery');
    const statServicesImpacted = document.getElementById('stat-services-impacted');

    // --- Mock API & State ---
    let mockState = {
      status: "IDLE",
      lastTriggered: null,
      services: { active: 5, total: 5 },
      logs: []
    };

    // --- Analytics State ---
    let totalRuns = 0;
    let totalServicesImpacted = 0;
    let recoveryTimes = [];
    let impactChart;
    let chartData = { 
      labels: [], 
      datasets: [{ 
        label: 'Times Impacted', 
        data: [], 
        backgroundColor: '#E50914',
        borderRadius: 4,
      }] 
    };
    
    // --- Toast Notification Function ---
    function showToast(message, type = 'error') {
      const toast = document.createElement('div');
      const bgColor = type === 'error' ? 'bg-red-600' : 'bg-green-500';
      toast.className = `toast-notification ${bgColor} text-white text-sm font-medium py-2 px-4 rounded-lg shadow-md mb-2`;
      toast.textContent = message;
      toastContainer.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // --- Log Functions ---
    function formatLogEntry(level, message) {
      const timestamp = new Date().toLocaleTimeString();
      let colorClass = 'text-netflix-gray';
      
      if (level === 'ERROR') {
        colorClass = 'text-red-400';
      } else if (level === 'WARN') {
        colorClass = 'text-yellow-400';
      } else if (level === 'CHAOS') {
        colorClass = 'text-netflix-red font-bold';
      } else if (level === 'INFO') {
        colorClass = 'text-blue-400';
      }

      return `<div class="${colorClass}"><span class="text-zinc-500 mr-2">[${timestamp}]</span><span class="font-medium mr-2">[${level}]</span> ${message}</div>`;
    }

    function addLog(level, message) {
      const logEntry = formatLogEntry(level, message);
      mockState.logs.unshift(logEntry);
      if (mockState.logs.length > 100) mockState.logs.pop();
      logPanel.innerHTML = mockState.logs.join('');
    }

    // --- UI Update Functions ---
    function updateStatusUI() {
      const { status, lastTriggered, services } = mockState;
      
      statusDot.classList.remove('animate-pulse-status', 'bg-gray-500', 'bg-green-500', 'bg-yellow-500', 'bg-red-500');
      statusText.classList.remove('text-netflix-gray', 'text-green-300', 'text-yellow-300', 'text-red-300');
      
      switch (status) {
        case 'IDLE':
          statusDot.classList.add('bg-green-500');
          statusText.textContent = 'IDLE';
          statusText.classList.add('text-green-300');
          break;
        case 'ACTIVE':
          statusDot.classList.add('bg-red-500', 'animate-pulse-status');
          statusText.textContent = 'CHAOS ACTIVE';
          statusText.classList.add('text-red-300');
          break;
        case 'WARNING':
          statusDot.classList.add('bg-yellow-500', 'animate-pulse-status');
          statusText.textContent = 'DEGRADED';
          statusText.classList.add('text-yellow-300');
          break;
        default:
          statusDot.classList.add('bg-gray-500');
          statusText.textContent = 'UNKNOWN';
          statusText.classList.add('text-netflix-gray');
      }

      lastTriggeredText.textContent = lastTriggered ? lastTriggered.toLocaleTimeString() : 'Never';
      activeServicesText.textContent = `${services.active} / ${services.total}`;
    }

    // --- Chart Functions ---
    function setupImpactChart() {
      const ctx = document.getElementById('impactChart').getContext('2d');
      impactChart = new Chart(ctx, {
        type: 'bar',
        data: chartData,
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              beginAtZero: true,
              grid: { color: 'rgba(179, 179, 179, 0.2)' },
              ticks: { color: '#b3b3b3', stepSize: 1 }
            },
            x: {
              grid: { display: false },
              ticks: { color: '#b3b3b3' }
            }
          },
          plugins: { 
            legend: { display: false },
            tooltip: {
              backgroundColor: '#141414',
              titleColor: '#f5f5f1',
              bodyColor: '#f5f5f1',
            }
          }
        }
      });
    }

    function addImpactToChart(serviceName, impactCount) {
      const index = chartData.labels.indexOf(serviceName);
      if (index > -1) {
        chartData.datasets[0].data[index] += impactCount;
      } else {
        chartData.labels.push(serviceName);
        chartData.datasets[0].data.push(impactCount);
      }
      impactChart.update();
    }

    // --- Mock API Callers ---
    async function loadStatus() {
      return new Promise(resolve => {
        setTimeout(() => {
          updateStatusUI();
          if (logPanel.innerHTML === "") {
             addLog('INFO', 'Simulation panel loaded. Awaiting experiment.');
          }
          resolve(mockState);
        }, 250);
      });
    }

    async function triggerChaos(experiment) {
      if (mockState.status === 'ACTIVE') {
        showToast('Experiment already in progress!', 'error');
        return;
      }
      
      // 1. Update Stats & UI
      triggerBtn.disabled = true;
      triggerBtn.classList.add('opacity-50', 'cursor-not-allowed');
      mockState.status = 'ACTIVE';
      mockState.lastTriggered = new Date();
      totalRuns++;
      statTotalRuns.textContent = totalRuns;
      updateStatusUI();
      
      const { service, type, magnitude } = experiment;
      let actionText = "";
      switch(type) {
        case "latency": actionText = `Injecting ${magnitude * 5}ms latency`; break;
        case "cpu": actionText = `Spiking CPU to ${magnitude}%`; break;
        case "terminate": actionText = `Terminating instance`; break;
        case "packet_loss": actionText = `Injecting ${magnitude}% packet loss`; break;
      }
      
      addLog('CHAOS', `Starting experiment: ${actionText} on ${service}`);
      
      // 2. Simulate Impact
      setTimeout(() => {
        let servicesDropped = 1;
        // If magnitude is high, chance to drop more services
        if (magnitude > 75 && Math.random() > 0.5) {
          servicesDropped = 2;
        }
        
        addLog('ERROR', `Service ${service} is unresponsive.`);
        if (servicesDropped > 1) {
          addLog('WARN', `Collateral damage: another service is now degraded.`);
        }
        
        mockState.services.active = Math.max(0, mockState.services.total - servicesDropped);
        totalServicesImpacted += servicesDropped;
        statServicesImpacted.textContent = totalServicesImpacted;
        
        mockState.status = 'WARNING';
        updateStatusUI();
        
        // Update chart
        addImpactToChart(service, servicesDropped);

      }, 1500);
      
      // 3. Simulate Recovery
      setTimeout(() => {
        addLog('INFO', `Service(s) recovered. Rolling back experiment.`);
        mockState.services.active = mockState.services.total;
        mockState.status = 'IDLE';
        updateStatusUI();
        
        // Update recovery stats
        const recoveryTime = 2.5; // (4000ms - 1500ms) / 1000
        recoveryTimes.push(recoveryTime);
        const avgRecovery = recoveryTimes.reduce((a, b) => a + b, 0) / recoveryTimes.length;
        statAvgRecovery.textContent = avgRecovery.toFixed(1) + 's';

        addLog('INFO', 'System back to IDLE state.');
        triggerBtn.disabled = false;
        triggerBtn.classList.remove('opacity-50', 'cursor-not-allowed');
      }, 4000);
    }

    // --- Event Listeners ---
    magnitudeSlider.addEventListener('input', (e) => {
      magnitudeValue.textContent = e.target.value;
    });

    chaosForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const experiment = {
        service: document.getElementById('target-service').value,
        type: document.getElementById('experiment-type').value,
        magnitude: document.getElementById('magnitude').value
      };
      triggerChaos(experiment);
    });

    // --- Initial Load ---
    document.addEventListener('DOMContentLoaded', () => {
      loadStatus();
      setupImpactChart();
    });
    
  </script>
</body>
</html>
